add_newline = false
# One line of facts, no "on/via/in/took" filler words; then the ❯ line. Colours: the terminal's 16, i.e. the theme.
format = "$hostname$container$directory$git_branch$git_status$python$nodejs$java$golang$rust$kubernetes$cmd_duration$status$fill${env_var.FW13_KEY_HINTS}$line_break$character"
[hostname]  # only over SSH (Starship's default)
format = "[$ssh_symbol$hostname]($style) "
[container]  # inside a distrobox / toolbox / podman container
format = "[⬢ $name]($style) "
[directory]  # from the git repo root when inside one; 🔒 = read-only folder
read_only = " 🔒"
[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "
[git_status]  # counts: ~3 modified, +1 staged, ?2 new, -1 deleted, »1 renamed, ≡1 stashed, !1 conflict, ⇡1 to push, ⇣2 to pull
format = '([$all_status$ahead_behind]($style))'  # each item ends with a space: no brackets needed
modified = "~${count} "
staged = "+${count} "
untracked = "?${count} "
deleted = "-${count} "
renamed = "»${count} "
stashed = "≡${count} "
conflicted = "!${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇡${ahead_count}⇣${behind_count} "
[python]  # version + the active venv, only in Python projects
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
[nodejs]
format = "[$symbol($version )]($style)"
[java]
format = "[$symbol($version )]($style)"
[golang]
format = "[$symbol($version )]($style)"
[rust]
format = "[$symbol($version )]($style)"
[fill]  # pushes the key hint to the right edge
symbol = " "
[env_var.FW13_KEY_HINTS]  # set by ~/.bashrc.local unless Settings → Appearance → Terminal → Key hints is off
format = "[$env_value]($style)"
style = "dimmed"
[status]  # exit code of a failed command
disabled = false
format = "[✘ $status]($style) "
# Kubernetes: only in folders with cluster files, and short ("☸ k8s", not "kubernetes-admin@kubernetes in")
[kubernetes]
disabled = false
format = '[$symbol$context( \($namespace\))]($style) '
detect_files = ["kustomization.yaml", "kustomization.yml", "Chart.yaml", "helmfile.yaml", "skaffold.yaml", "Tiltfile"]
detect_folders = ["k8s", "kubernetes", "manifests", "charts", "helm"]
[[kubernetes.contexts]]  # first match wins: kubeadm's default name, then any user@cluster shows just the cluster
context_pattern = "kubernetes-admin@kubernetes"
context_alias = "k8s"
[[kubernetes.contexts]]
context_pattern = ".*@(?P<cluster>.+)"
context_alias = "$cluster"
[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
