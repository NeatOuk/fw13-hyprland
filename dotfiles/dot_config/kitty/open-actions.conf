# Clicks on the Claude Code status line (fw-claude-limits --statusline emits these links only inside kitty):
# model / effort / advisor type the slash command into the clicked window (Claude's own picker opens),
# the branch opens fw-claude-limits' fuzzel branch picker for that repo.
protocol fw-claude
url ^fw-claude:model$
action send_text all /model\r

protocol fw-claude
url ^fw-claude:effort$
action send_text all /effort\r

protocol fw-claude
url ^fw-claude:advisor$
action send_text all /advisor\r

protocol fw-claude
url ^fw-claude://branch/
action launch --type=background fw-claude-limits --branch ${URL_PATH}
