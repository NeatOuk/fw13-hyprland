# herdr (agent multiplexer, installed and updated by mise: ~/.config/mise/config.toml). Created once by fw13-hypr,
# then yours to edit; every key and its default: herdr --default-config. Apply changes: herdr server reload-config

[update]
# mise updates herdr (mise upgrade / the installer), so herdr's own new-version notice is off
version_check = false

[theme]
# the terminal's colours, so herdr follows Settings → Appearance (Dark / Light) instead of its own dark theme
name = "terminal"

[theme.custom]
# highlight rows with the terminal's "black" (a light tint on Light, dark on Dark) rather than its grey
active_row_bg = "black"
selection_bg = "black"
