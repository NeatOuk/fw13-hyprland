# Global tools — identical on every distro. Per-project versions go in <project>/mise.toml
[tools]
node = "lts"
chezmoi = "latest"
starship = "latest"
opencode = "latest"   # AI coding agent; Ollama servers via fw-opencode (bar icon)
"npm:@earendil-works/pi-coding-agent" = "latest"   # Pi coding agent (pi.dev); same Ollama servers, Settings → Coding agent
uv = "latest"        # Python packaging (user decision)
kubectl = "1.34"     # Kubernetes CLI, pinned minor (user decision)
lazygit = "latest"   # git TUI, LazyVim's <leader>gg (official release binary; user decision)
herdr = "latest"     # agent multiplexer: Claude/OpenCode side by side, local + SSH machines (user decision)

[settings]
experimental = false
